# Lock screen — https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Catppuccin Mocha

$base     = rgb(1e1e2e)
$surface0 = rgb(313244)
$text     = rgb(cdd6f4)
$subtext  = rgb(a6adc8)
$mauve    = rgb(cba6f7)
$blue     = rgb(89b4fa)
$red      = rgb(f38ba8)
$yellow   = rgb(f9e2af)
$green    = rgb(a6e3a1)

$font     = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 6, easeOut
    animation = fadeOut, 1, 6, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    brightness = 0.6
    vibrancy = 0.2
}

# Time
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 120
    font_family = $font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 24
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Welcome back, $USER
    color = $mauve
    font_size = 16
    font_family = $font
    position = 0, -150
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 60
    outline_thickness = 2
    rounding = 15

    outer_color = rgba(cba6f7ee) rgba(89b4faee) 45deg
    inner_color = rgba(1e1e2ecc)
    font_color = $text
    check_color = $yellow
    fail_color = $red
    capslock_color = $yellow

    font_family = $font
    placeholder_text = <span foreground="##a6adc8">󰌾  Password</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(11111bcc)

    position = 0, -40
    halign = center
    valign = center
}
