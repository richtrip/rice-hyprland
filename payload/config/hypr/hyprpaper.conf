# Wallpaper — https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# Points at the whole folder: with one image it just shows that image,
# drop more in and it rotates through them (randomly, every 30 minutes).

wallpaper {
    monitor =
    path = ~/Pictures/Wallpapers
    fit_mode = cover
    order = random
    timeout = 1800
}

splash = false
ipc = true
