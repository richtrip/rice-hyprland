name: Build and release

# PRs and pushes to main: syntax-check the scripts and prove the tarball builds.
# Releases (either way publishes hyprland-rice.tar.gz + SHA256SUMS as a GitHub Release, which
# the README links to via /releases/latest/download/hyprland-rice.tar.gz):
#   - Actions tab -> "Build and release" -> Run workflow (on main): picks the next version
#     number automatically (patch/minor/major bump of the highest existing vX.Y.Z tag),
#     creates the tag and release on GitHub's side, and can optionally delete an old release.
#   - or push a tag like v1.2.3 yourself.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest vX.Y.Z version to increment
        type: choice
        options: [patch, minor, major]
        default: patch
      delete_release:
        description: "Optional: old release tag to delete after publishing (e.g. v1.0.0). Leave empty to keep everything."
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          # Pick the checker from the shebang: some *.sh files (keybind-cheatsheet.sh) are Python.
          for f in install.sh scripts/*.sh payload/local-bin/*.sh payload/config/waybar/scripts/*.sh; do
            if head -n1 "$f" | grep -q python; then
              python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read())' "$f"
            else
              bash -n "$f"
            fi
          done

      - name: Build tarball
        run: scripts/build-dist.sh

      - name: Checksum
        working-directory: dist
        run: sha256sum hyprland-rice.tar.gz | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: hyprland-rice
          path: |
            dist/hyprland-rice.tar.gz
            dist/SHA256SUMS

  release:
    needs: build
    # A pushed v* tag, or a manual run from main. (Never a manual run from some other branch.)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need every tag to work out the next version

      - uses: actions/download-artifact@v4
        with:
          name: hyprland-rice
          path: dist

      - name: Work out the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            next="v${major}.${minor}.${patch}"
          fi
          echo "Latest tag: ${latest:-none} -> new tag: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # For a manual run the tag doesn't exist yet: gh creates it at this commit, server-side.
          # For a pushed tag it already exists and --target is ignored.
          gh release create "$TAG" dist/hyprland-rice.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      - name: Delete old release (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.delete_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ inputs.delete_release }}
          NEW: ${{ steps.version.outputs.tag }}
        run: |
          [[ "$OLD" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Refusing: '$OLD' is not a vX.Y.Z tag." >&2; exit 1; }
          [ "$OLD" != "$NEW" ] || { echo "Refusing to delete the release just published." >&2; exit 1; }
          gh release delete "$OLD" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
