name: Build and release

# PRs and pushes to main: syntax-check the scripts and prove the tarball builds.
# Tags like v1.0.0: build the tarball and publish it as a GitHub Release asset, which the
# README links to via /releases/latest/download/hyprland-rice.tar.gz.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          # Pick the checker from the shebang: some *.sh files (keybind-cheatsheet.sh) are Python.
          for f in install.sh scripts/*.sh payload/local-bin/*.sh payload/config/waybar/scripts/*.sh; do
            if head -n1 "$f" | grep -q python; then
              python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read())' "$f"
            else
              bash -n "$f"
            fi
          done

      - name: Build tarball
        run: scripts/build-dist.sh

      - name: Checksum
        working-directory: dist
        run: sha256sum hyprland-rice.tar.gz | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: hyprland-rice
          path: |
            dist/hyprland-rice.tar.gz
            dist/SHA256SUMS

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hyprland-rice
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/hyprland-rice.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
